[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mahoraga"
version = "0.1.0"
description = "Adaptive evolution engine for Sentinel-validated trading hypotheses"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mahoraga"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
